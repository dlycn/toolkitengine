<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>命令执行工具</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .container { width: 80%; margin: 0 auto; }
        h1 { text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input[type="text"], select { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 15px; background-color: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #output { margin-top: 20px; padding: 10px; border: 1px solid #ccc; min-height: 100px; background-color: #f9f9f9; }
    </style>
</head>
<body>
<div class="container">
    <h1>命令执行工具</h1>
    <form id="execForm">
        <div class="form-group">
            <label for="tool">选择工具：</label>
            <select id="tool" name="tool">
                <option value="ffmpeg">ffmpeg</option>
                <option value="basisu">basisu</option>
                <option value="bcdec">bcdec</option>
            </select>
        </div>
        <div class="form-group">
            <label for="args">输入参数：</label>
            <input type="text" id="args" name="args" placeholder="例如: -i input.mp4 output.png">
        </div>
        <button type="submit">执行</button>
    </form>
    <div id="output"></div>
</div>

<script>
document.getElementById('execForm').addEventListener('submit', function(event) {
    event.preventDefault();
    var tool = document.getElementById('tool').value;
    var args = document.getElementById('args').value;

    fetch('/exec', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({ tool: tool, args: args }),
    })
    .then(response => response.json())
    .then(data => {
        document.getElementById('output').innerText = data.output;
    })
    .catch((error) => {
        console.error('Error:', error);
        document.getElementById('output').innerText = '执行命令时发生错误。';
    });
});
</script>
</body>
</html>
